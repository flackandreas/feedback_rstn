services:
  web:
    build: .
    ports:
      - "8888:80"
    volumes:
      - ./src:/var/www/html
    environment:
      # Ohne diese Angabe laeuft der Container in UTC, und jeder Zeitstempel
      # liegt im Sommer zwei Stunden in der Vergangenheit.
      TZ: ${TZ:-Europe/Berlin}
    networks:
      - app-network

  db:
    image: mariadb:10.11
    restart: always
    environment:
      # MariaDBs NOW() folgt der Uhr des Containers. Ohne TZ ist das UTC, und
      # damit steht in created_at, modified_at und seen_at die falsche Zeit -
      # auch CURDATE() springt dann zwei Stunden zu spaet auf den neuen Tag.
      TZ: ${TZ:-Europe/Berlin}
      MARIADB_ROOT_PASSWORD: db_user
      MARIADB_DATABASE: db_feedback
    volumes:
      - ./db-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network

  # Nur zur Wartung, nie im Dauerbetrieb. Ohne das Profil startet es nicht mit:
  #   docker compose --profile wartung up -d phpmyadmin
  #
  # Bis hierher meldete es sich selbst als root an und lauschte auf allen
  # Netzwerkadressen - jedes Geraet im Netz hatte damit ohne Passwort vollen
  # Zugriff auf alle Datenbanken. Jetzt:
  #   - nur auf dem Rechner selbst erreichbar (127.0.0.1). Von einem anderen
  #     Geraet aus per SSH-Tunnel:  ssh -L 8080:127.0.0.1:8080 <benutzer>@<server>
  #   - keine automatische Anmeldung: wer die Seite erreicht, muss Benutzer und
  #     Passwort der Datenbank kennen.
  #   - der Port ist einstellbar (PHPMYADMIN_PORT), weil 8080 auf manchem
  #     Server schon belegt ist.
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    profiles: ["wartung"]
    # Nach einem Neustart des Rechners bleibt es aus.
    restart: "no"
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8080}:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
